# Local stack: the API plus its Postgres. For development/demo — inject real
# secrets and enable TLS for anything internet-facing.
#
# It runs the PRODUCTION image (`target: runtime`) with `NODE_ENV=development`,
# which is deliberate: see the note on that variable below. Flipping it to
# `production` means also supplying API_URL, all five AWS_* bucket variables
# (env validation refuses to boot without them) and serving over https, or the
# container will crash-loop straight after a green migration step.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: queerpulse
      POSTGRES_PASSWORD: queerpulse
      POSTGRES_DB: queerpulse
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U queerpulse']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # NOT `production`. This stack serves the API over plain http on
      # localhost, and `NODE_ENV=production` makes two things impossible at
      # once: env validation demands API_URL plus all five AWS_* bucket
      # variables (absent here, so the container crash-looped right after a
      # green migration step), and every auth/CSRF cookie is issued `Secure`,
      # which a browser drops over http. Supplying placeholder AWS_* values
      # would not help either — `storage:cors` below then tries to reach a
      # bogus endpoint and exits non-zero, breaking the `&&` start chain.
      NODE_ENV: development
      # pino-pretty is a devDependency and is absent from the runtime image, so
      # the development default (pretty logging) would throw at boot before a
      # logger exists to say why. Opt out explicitly.
      LOG_PRETTY: 'false'
      PORT: '3000'
      # Where a browser reaches this API for `GET /files/*` — image URLs are
      # built from it.
      API_URL: http://localhost:3000
      DATABASE_URL: postgres://queerpulse:queerpulse@postgres:5432/queerpulse
      # The bundled Postgres speaks plaintext, so disable TLS explicitly here.
      # For a managed/prod database, remove this and provide DATABASE_SSL_CA.
      DATABASE_SSL: 'false'
      # Replace these throwaway values before exposing the service.
      # CHANGE THESE. Both must be >=32 chars and differ from each other, or
      # the app fails validation at boot (src/config/env.validation.ts).
      JWT_ACCESS_SECRET: change-me-access-secret-0000000000
      JWT_REFRESH_SECRET: change-me-refresh-secret-000000000
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      FRONTEND_URL: http://localhost:5173
    ports:
      - '3000:3000'
    # Deploy order: preflight, run migrations, apply the bucket CORS policy,
    # then start the server — the order README "Deployment" documents.
    # `migration:preflight` drops a leftover INVALID index from an interrupted
    # `CREATE INDEX CONCURRENTLY` build, which would otherwise collide by name
    # with the retry and wedge every later deploy. `storage:cors` is idempotent
    # and reads its origins from FRONTEND_URL; it's a no-op unless the AWS_*
    # bucket vars are also set. All three steps are safe to re-run.
    command: sh -c "npm run migration:preflight && npm run migration:run:prod && npm run storage:cors && node dist/main"

volumes:
  pgdata:
